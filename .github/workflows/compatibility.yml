name: Ruby and Rails compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.0"
            rails: "~> 7.0.0"
          - ruby: "3.0"
            rails: "~> 7.1.0"
          - ruby: "3.1"
            rails: "~> 7.2.0"
          - ruby: "3.2"
            rails: "~> 8.0.0"
          - ruby: "3.2"
            rails: "~> 8.1.0"
          - ruby: "4.0"
            rails: "~> 8.1.0"
    env:
      BUNDLE_GEMFILE: gemfiles/rails.gemfile
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: "2.5.23"
          bundler-cache: true
      - run: bundle exec rake test
